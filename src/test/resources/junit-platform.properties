# Parallel scenario execution is supported by the framework - DriverManager
# stores each thread's WebDriver in a ThreadLocal specifically so scenarios
# never share a browser (see LEARNING_CONCEPTS.md) - but it is OFF by
# default here. Every parallel scenario launches its own real browser
# process, and on a typical laptop that quickly saturates CPU, which makes
# UI interactions flaky (clicks/renders lagging behind WebDriverWait's
# polling) for reasons that have nothing to do with bugs in the code under
# test. Turn it on locally or in CI once you've confirmed your runner has
# the headroom for it:
#
#   mvn test -Dcucumber.execution.parallel.enabled=true
#
# and tune the thread count via -Dcucumber.execution.parallel.config.fixed.parallelism=N
cucumber.execution.parallel.enabled=false
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=2

cucumber.execution.order=random
