# Non-secret defaults. Secrets and environment-specific values (base URL,
# credentials) live in .env - see ConfigManager for the resolution order.

explicit.wait.seconds=10
pageload.timeout.seconds=30

# httpbin.org is a free request/response inspection service used by the
# API auth demo scenarios - it echoes back whatever Basic Auth header it
# receives, which is perfect for asserting our credentials were sent.
api.auth.base.url=https://httpbin.org

# Upper bound on browsers open at the same time across all threads (parallel
# scenarios x sessions per scenario). Sessions beyond this wait for a free slot.
# Keep it >= parallelism x the most sessions any one scenario opens, or
# threads can block each other waiting for permits.
MAX_BROWSER_SESSIONS=4
